# ==============================================================================
# ECCI Growth OS — Enterprise Cloudflare Wrangler Configuration (TOML)
# ==============================================================================
# Purpose: Configuration manifest for Cloudflare Workers & Pages Functions.
# Configures core bindings, environment variables, multi-stage environments,
# AI capabilities, persistent storage, queuing, and edge performance optimization.
# ==============================================================================

name = "ecci-growth-os"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ------------------------------------------------------------------------------
# Performance & Edge Routing Optimization
# ------------------------------------------------------------------------------
# Smart Placement automatically routes worker execution closer to backends / data sources.
[placement]
mode = "smart"

# Automated Observability & Telemetry
[observability]
enabled = true

# ------------------------------------------------------------------------------
# Production Environment Variables (Non-secret)
# ------------------------------------------------------------------------------
# Consumed by API Gateway, AI Engine, Workflow Manager, and Frontend UI.
[vars]
APP_NAME = "ECCI Growth OS"
COMPANY_NAME = "ECCI Growth"
APP_ENV = "production"
APP_VERSION = "1.0.0"
NODE_ENV = "production"
API_VERSION = "v1"
DEFAULT_LOCALE = "en-US"
DEFAULT_TIMEZONE = "UTC"
ENABLE_ANALYTICS = "true"
ENABLE_AI = "true"
ENABLE_EMAILS = "true"
ENABLE_SOCIAL_AUTOMATION = "true"
ENABLE_BUILDER_PANEL = "true"
ENABLE_CAMPAIGNS = "true"
ENABLE_VECTOR_SEARCH = "true"
ENABLE_WORKFLOWS = "true"
NEXT_PUBLIC_APP_NAME = "ECCI Growth OS"
NEXT_PUBLIC_APP_ENV = "production"
NEXT_PUBLIC_FIREBASE_PROJECT_ID = "ai-studio-eccigrowthos"

# ------------------------------------------------------------------------------
# Expected Production Secrets (DO NOT HARDCODE VALUES)
# ------------------------------------------------------------------------------
# Set these secrets securely using Wrangler CLI:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put META_APP_SECRET
#   npx wrangler secret put META_ACCESS_TOKEN
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#   npx wrangler secret put GOOGLE_API_KEY
#   npx wrangler secret put GOOGLE_MAPS_KEY
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put SENDGRID_API_KEY
#   npx wrangler secret put MAILGUN_API_KEY
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put PAYPAL_CLIENT_SECRET
#   npx wrangler secret put CLOUDFLARE_API_TOKEN
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put ENCRYPTION_KEY
#   npx wrangler secret put WEBHOOK_SECRET
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   npx wrangler secret put NOTION_API_KEY
#   npx wrangler secret put SLACK_BOT_TOKEN
# ------------------------------------------------------------------------------

# ==============================================================================
# Cloudflare Infrastructure Resource Bindings
# ==============================================================================

# 1. D1 Database — Production Relational Database (CRM, Billing, Users)
[[d1_databases]]
binding = "DB"
database_name = "ecci-db-prod"
database_id = "<YOUR_PRODUCTION_D1_DATABASE_ID>"

# 2. KV Namespaces — Edge Caching, Session Management & Config Store
[[kv_namespaces]]
binding = "CACHE"
id = "<YOUR_PRODUCTION_CACHE_KV_ID>"

[[kv_namespaces]]
binding = "SESSIONS"
id = "<YOUR_PRODUCTION_SESSIONS_KV_ID>"

[[kv_namespaces]]
binding = "CONFIG"
id = "<YOUR_PRODUCTION_CONFIG_KV_ID>"

# 3. R2 Object Storage Buckets — Assets & Automated Report Storage
[[r2_buckets]]
binding = "ASSET_BUCKET"
bucket_name = "ecci-assets-prod"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "ecci-reports-prod"

# 4. Queues — Asynchronous Background Jobs & Automation Workflows
[[queues.producers]]
queue = "ecci-background-queue-prod"
binding = "BACKGROUND_QUEUE"

[[queues.consumers]]
queue = "ecci-background-queue-prod"
max_batch_size = 10
max_batch_timeout = 30

# 5. Durable Objects — Real-Time AI Session State & Workflow Engine
[durable_objects]
bindings = [
  { name = "AI_AGENT", class_name = "AIAgentSessionManager" },
  { name = "WORKFLOW_ENGINE", class_name = "WorkflowEngine" }
]

[[migrations]]
tag = "v1"
new_classes = ["AIAgentSessionManager", "WorkflowEngine"]

# 6. Vectorize Index — Semantic Search & AI Memory Index
[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "ecci-vector-index-prod"

# 7. Workers AI — Native On-Edge Machine Learning & LLM Inferences
[ai]
binding = "AI"

# 8. Browser Rendering — Automated Screenshot, PDF & Headless Scraping
[browser]
binding = "BROWSER"

# 9. Analytics Engine — High-Velocity Real-Time Event & Usage Telemetry
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "ecci_analytics_prod"

# 10. Hyperdrive — High-Performance Distributed SQL Connection Pooling
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "<YOUR_PRODUCTION_HYPERDRIVE_ID>"


# ==============================================================================
# Multi-Stage Environment Configurations
# ==============================================================================

# ------------------------------------------------------------------------------
# DEVELOPMENT ENVIRONMENT
# ------------------------------------------------------------------------------
[env.dev]
name = "ecci-growth-os-dev"
routes = [
  { pattern = "dev.eccigrowthos.com/*", zone_name = "eccigrowthos.com" }
]

[env.dev.vars]
APP_NAME = "ECCI Growth OS [DEV]"
COMPANY_NAME = "ECCI Growth Dev"
APP_ENV = "development"
APP_VERSION = "1.0.0-dev"
NODE_ENV = "development"
API_VERSION = "v1"
DEFAULT_LOCALE = "en-US"
DEFAULT_TIMEZONE = "UTC"
ENABLE_ANALYTICS = "false"
ENABLE_AI = "true"
ENABLE_EMAILS = "false"
ENABLE_SOCIAL_AUTOMATION = "false"
ENABLE_BUILDER_PANEL = "true"
ENABLE_CAMPAIGNS = "true"
ENABLE_VECTOR_SEARCH = "true"
ENABLE_WORKFLOWS = "true"
NEXT_PUBLIC_APP_NAME = "ECCI Growth OS (Dev)"
NEXT_PUBLIC_APP_ENV = "development"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "ecci-db-dev"
database_id = "<YOUR_DEV_D1_DATABASE_ID>"

[[env.dev.kv_namespaces]]
binding = "CACHE"
id = "<YOUR_DEV_CACHE_KV_ID>"

[[env.dev.kv_namespaces]]
binding = "SESSIONS"
id = "<YOUR_DEV_SESSIONS_KV_ID>"

[[env.dev.kv_namespaces]]
binding = "CONFIG"
id = "<YOUR_DEV_CONFIG_KV_ID>"

[[env.dev.r2_buckets]]
binding = "ASSET_BUCKET"
bucket_name = "ecci-assets-dev"

[[env.dev.r2_buckets]]
binding = "REPORTS"
bucket_name = "ecci-reports-dev"

[[env.dev.queues.producers]]
queue = "ecci-background-queue-dev"
binding = "BACKGROUND_QUEUE"

[[env.dev.vectorize]]
binding = "VECTOR_INDEX"
index_name = "ecci-vector-index-dev"

[[env.dev.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "ecci_analytics_dev"


# ------------------------------------------------------------------------------
# STAGING ENVIRONMENT
# ------------------------------------------------------------------------------
[env.staging]
name = "ecci-growth-os-staging"
routes = [
  { pattern = "staging.eccigrowthos.com/*", zone_name = "eccigrowthos.com" }
]

[env.staging.vars]
APP_NAME = "ECCI Growth OS [STAGING]"
COMPANY_NAME = "ECCI Growth Staging"
APP_ENV = "staging"
APP_VERSION = "1.0.0-rc"
NODE_ENV = "production"
API_VERSION = "v1"
DEFAULT_LOCALE = "en-US"
DEFAULT_TIMEZONE = "UTC"
ENABLE_ANALYTICS = "true"
ENABLE_AI = "true"
ENABLE_EMAILS = "true"
ENABLE_SOCIAL_AUTOMATION = "true"
ENABLE_BUILDER_PANEL = "true"
ENABLE_CAMPAIGNS = "true"
ENABLE_VECTOR_SEARCH = "true"
ENABLE_WORKFLOWS = "true"
NEXT_PUBLIC_APP_NAME = "ECCI Growth OS (Staging)"
NEXT_PUBLIC_APP_ENV = "staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ecci-db-staging"
database_id = "<YOUR_STAGING_D1_DATABASE_ID>"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "<YOUR_STAGING_CACHE_KV_ID>"

[[env.staging.kv_namespaces]]
binding = "SESSIONS"
id = "<YOUR_STAGING_SESSIONS_KV_ID>"

[[env.staging.kv_namespaces]]
binding = "CONFIG"
id = "<YOUR_STAGING_CONFIG_KV_ID>"

[[env.staging.r2_buckets]]
binding = "ASSET_BUCKET"
bucket_name = "ecci-assets-staging"

[[env.staging.r2_buckets]]
binding = "REPORTS"
bucket_name = "ecci-reports-staging"

[[env.staging.queues.producers]]
queue = "ecci-background-queue-staging"
binding = "BACKGROUND_QUEUE"

[[env.staging.vectorize]]
binding = "VECTOR_INDEX"
index_name = "ecci-vector-index-staging"

[[env.staging.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "ecci_analytics_staging"


# ------------------------------------------------------------------------------
# PRODUCTION ENVIRONMENT OVERRIDES
# ------------------------------------------------------------------------------
[env.production]
name = "ecci-growth-os-prod"
routes = [
  { pattern = "api.eccigrowthos.com/*", zone_name = "eccigrowthos.com" }
]
