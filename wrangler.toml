# ==============================================================================
# ECCI Growth OS — Enterprise Cloudflare Wrangler Configuration (TOML)
# ==============================================================================
# Purpose: Cloudflare Pages & Pages Functions Configuration Manifest.
# Serves Vite static bundle from `dist/` and serverless API endpoints from `functions/`.
# ==============================================================================

name = "ecci-growth-os"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------------------------------------------
# Performance & Edge Routing Optimization
# ------------------------------------------------------------------------------
[placement]
mode = "smart"

[observability]
enabled = true

# ------------------------------------------------------------------------------
# Production Environment Variables (Non-secret)
# ------------------------------------------------------------------------------
[vars]
APP_NAME = "ECCI Growth OS"
COMPANY_NAME = "ECCI Growth"
APP_ENV = "production"
APP_VERSION = "1.0.0"
NODE_ENV = "production"
API_VERSION = "v1"
DEFAULT_LOCALE = "en-US"
DEFAULT_TIMEZONE = "UTC"
ENABLE_ANALYTICS = "true"
ENABLE_AI = "true"
ENABLE_EMAILS = "true"
ENABLE_SOCIAL_AUTOMATION = "true"
ENABLE_BUILDER_PANEL = "true"
ENABLE_CAMPAIGNS = "true"
ENABLE_VECTOR_SEARCH = "true"
ENABLE_WORKFLOWS = "true"
NEXT_PUBLIC_APP_NAME = "ECCI Growth OS"
NEXT_PUBLIC_APP_ENV = "production"
NEXT_PUBLIC_FIREBASE_PROJECT_ID = "ai-studio-eccigrowthos"

# ------------------------------------------------------------------------------
# Expected Production Secrets (Provisioned via CLI: wrangler secret put <NAME>)
# ------------------------------------------------------------------------------
# GEMINI_API_KEY
# OPENAI_API_KEY
# ANTHROPIC_API_KEY
# META_APP_SECRET
# META_ACCESS_TOKEN
# GOOGLE_CLIENT_SECRET
# GOOGLE_API_KEY
# GOOGLE_MAPS_KEY
# RESEND_API_KEY
# SENDGRID_API_KEY
# MAILGUN_API_KEY
# STRIPE_SECRET_KEY
# PAYPAL_CLIENT_SECRET
# CLOUDFLARE_API_TOKEN
# JWT_SECRET
# ENCRYPTION_KEY
# WEBHOOK_SECRET
# SUPABASE_SERVICE_ROLE_KEY
# NOTION_API_KEY
# SLACK_BOT_TOKEN

# ==============================================================================
# Infrastructure Bindings
# ==============================================================================

# 1. D1 Database
[[d1_databases]]
binding = "DB"
database_name = "ecci-db-prod"
database_id = "<YOUR_PRODUCTION_D1_DATABASE_ID>"

# 2. KV Namespaces
[[kv_namespaces]]
binding = "CACHE"
id = "<YOUR_PRODUCTION_CACHE_KV_ID>"

[[kv_namespaces]]
binding = "SESSIONS"
id = "<YOUR_PRODUCTION_SESSIONS_KV_ID>"

[[kv_namespaces]]
binding = "CONFIG"
id = "<YOUR_PRODUCTION_CONFIG_KV_ID>"

# 3. R2 Buckets
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "ecci-assets-prod"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "ecci-reports-prod"

# 4. Queues
[[queues.producers]]
queue = "ecci-background-queue-prod"
binding = "BACKGROUND_QUEUE"

[[queues.consumers]]
queue = "ecci-background-queue-prod"
max_batch_size = 10
max_batch_timeout = 30

# 5. Durable Objects
[durable_objects]
bindings = [
  { name = "AI_AGENT", class_name = "AIAgentSessionManager" },
  { name = "WORKFLOW_ENGINE", class_name = "WorkflowEngine" }
]

[[migrations]]
tag = "v1"
new_classes = ["AIAgentSessionManager", "WorkflowEngine"]

# 6. Vectorize
[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "ecci-vector-index-prod"

# 7. Workers AI
[ai]
binding = "AI"

# 8. Browser Rendering
[browser]
binding = "BROWSER"

# 9. Analytics Engine
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "ecci_analytics_prod"

# 10. Hyperdrive
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "<YOUR_PRODUCTION_HYPERDRIVE_ID>"

# ==============================================================================
# Multi-Stage Environments
# ==============================================================================

[env.dev]
name = "ecci-growth-os-dev"

[env.dev.vars]
APP_NAME = "ECCI Growth OS [DEV]"
COMPANY_NAME = "ECCI Growth Dev"
APP_ENV = "development"
APP_VERSION = "1.0.0-dev"
NODE_ENV = "development"
API_VERSION = "v1"
DEFAULT_LOCALE = "en-US"
DEFAULT_TIMEZONE = "UTC"
ENABLE_ANALYTICS = "false"
ENABLE_AI = "true"
ENABLE_EMAILS = "false"
ENABLE_SOCIAL_AUTOMATION = "false"
ENABLE_BUILDER_PANEL = "true"
ENABLE_CAMPAIGNS = "true"
ENABLE_VECTOR_SEARCH = "true"
ENABLE_WORKFLOWS = "true"
NEXT_PUBLIC_APP_NAME = "ECCI Growth OS (Dev)"
NEXT_PUBLIC_APP_ENV = "development"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "ecci-db-dev"
database_id = "<YOUR_DEV_D1_DATABASE_ID>"

[[env.dev.kv_namespaces]]
binding = "CACHE"
id = "<YOUR_DEV_CACHE_KV_ID>"

[[env.dev.kv_namespaces]]
binding = "SESSIONS"
id = "<YOUR_DEV_SESSIONS_KV_ID>"

[[env.dev.kv_namespaces]]
binding = "CONFIG"
id = "<YOUR_DEV_CONFIG_KV_ID>"

[[env.dev.r2_buckets]]
binding = "ASSETS"
bucket_name = "ecci-assets-dev"

[[env.dev.r2_buckets]]
binding = "REPORTS"
bucket_name = "ecci-reports-dev"

[[env.dev.queues.producers]]
queue = "ecci-background-queue-dev"
binding = "BACKGROUND_QUEUE"

[[env.dev.vectorize]]
binding = "VECTOR_INDEX"
index_name = "ecci-vector-index-dev"

[[env.dev.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "ecci_analytics_dev"


[env.staging]
name = "ecci-growth-os-staging"

[env.staging.vars]
APP_NAME = "ECCI Growth OS [STAGING]"
COMPANY_NAME = "ECCI Growth Staging"
APP_ENV = "staging"
APP_VERSION = "1.0.0-rc"
NODE_ENV = "production"
API_VERSION = "v1"
DEFAULT_LOCALE = "en-US"
DEFAULT_TIMEZONE = "UTC"
ENABLE_ANALYTICS = "true"
ENABLE_AI = "true"
ENABLE_EMAILS = "true"
ENABLE_SOCIAL_AUTOMATION = "true"
ENABLE_BUILDER_PANEL = "true"
ENABLE_CAMPAIGNS = "true"
ENABLE_VECTOR_SEARCH = "true"
ENABLE_WORKFLOWS = "true"
NEXT_PUBLIC_APP_NAME = "ECCI Growth OS (Staging)"
NEXT_PUBLIC_APP_ENV = "staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ecci-db-staging"
database_id = "<YOUR_STAGING_D1_DATABASE_ID>"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "<YOUR_STAGING_CACHE_KV_ID>"

[[env.staging.kv_namespaces]]
binding = "SESSIONS"
id = "<YOUR_STAGING_SESSIONS_KV_ID>"

[[env.staging.kv_namespaces]]
binding = "CONFIG"
id = "<YOUR_STAGING_CONFIG_KV_ID>"

[[env.staging.r2_buckets]]
binding = "ASSETS"
bucket_name = "ecci-assets-staging"

[[env.staging.r2_buckets]]
binding = "REPORTS"
bucket_name = "ecci-reports-staging"

[[env.staging.queues.producers]]
queue = "ecci-background-queue-staging"
binding = "BACKGROUND_QUEUE"

[[env.staging.vectorize]]
binding = "VECTOR_INDEX"
index_name = "ecci-vector-index-staging"

[[env.staging.analytics_engine_datasets]]
